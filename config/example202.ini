[Data]
epsilon = -15
beta = 0.01,0.001
tau = 0.1
phik = 1

[Space_Discretization]
; 2^(initial_refinement + p  -1) + 1: numbers of dofs
initial_refinement = 7
fe_degree = 1

[Calculation_Mode]
example = 202
; cheb,poly_krylov,rat_krylov,leja
method_matrix_function = cheb,leja
random_vectors = false
clc_ref_ellipse = false
strong_damping = true
reuse_ellipse = true

; --- ellipse computation -----------------------------------------------------
; ritz      : existing method. Chebyshev/Arnoldi detects Ritz values, then
;             Ellipse::create_opt_ellipse fits them (minimal Manteuffel radius,
;             internal constraint center + radiusx < 1).
; enclosure : new method. Rectangle R = [-tau*delta, 0] + i[-tau*sqrt(mu), tau*sqrt(mu)]
;             enclosing W_G(tau*S) in the energy inner product G = diag(K,M),
;             then the circumscribing ellipse of minimal capacity.
;             mu = lambda_max(M^-1 K), delta = lambda_max(M^-1 D) via power
;             iteration on the symmetric definite pencils (SpectralBounds::Eigen).
ellipse_method = ritz,enclosure

; Upper bound for the rightmost point (center + radiusx) of the enclosure ellipse.
; NOT part of the construction of the papers -- it trades capacity (degree) for a
; smaller phi_k hump and mirrors the internal limit of create_opt_ellipse.
; Set to a very large value (e.g. 1e300) to get the unmodified paper construction.
; With strong_damping = true the spectrum has overdamped real eigenvalues near
; -tau*2*beta*mu, so without this bound the ellipse reaches far into the right
; half-plane and phi_k cannot be evaluated in double precision.
; ellipse_max_real = 500.0

; only used when the entrywise estimators are active; kept here for reference
ellipse_safety    = 4.0
ellipse_eps_shape = 0.0

[Output]
info_ellipse = false